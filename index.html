<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0D12" />

    <!-- %BRAND_NAME% e %SITE_URL% são preenchidos no build por vite.config.ts -->
    <title>%BRAND_NAME% · planejador de viagens em grupo</title>
    <meta
      name="description"
      content="Cada pessoa do grupo informa seus limites e preferências; um motor determinístico calcula o plano mais justo e explica quem cedeu o quê."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="%BRAND_NAME%" />
    <meta property="og:title" content="%BRAND_NAME% · planejador de viagens em grupo" />
    <meta
      property="og:description"
      content="Cada pessoa diz seus limites. O motor calcula o plano mais justo e mostra quem cedeu o quê."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mapa de compatibilidade de um grupo, com dois conflitos destacados em âmbar." />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
